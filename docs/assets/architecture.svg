<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="title desc">
  <title id="title">reqly 2.1.0 architecture</title>
  <desc id="desc">Application talks to the high-level SDK or the core client, which uses TL, crypto and WASM modules over the MTProto transport to reach Telegram data centers. Streaming is exposed as HTTP 206 or WebSocket frames.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="920" height="520" rx="18" fill="url(#bg2)"/>
  <text x="40" y="52" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700">reqly 2.1.0 — architecture at a glance</text>
  <text x="40" y="74" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13">One client instance owns all state; no module globals, no native addons required.</text>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="110" width="180" height="70" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="140" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Application</text>
    <text x="130" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">Worker · Node · edge</text>

    <rect x="290" y="110" width="180" height="70" rx="12" fill="#082f49" stroke="#0ea5e9"/>
    <text x="380" y="140" fill="#e0f2fe" font-size="15" font-weight="600" text-anchor="middle">ReqlySdk</text>
    <text x="380" y="160" fill="#7dd3fc" font-size="11" text-anchor="middle">download · stream · cache · retry</text>

    <rect x="540" y="110" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="630" y="140" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Reqly core</text>
    <text x="630" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">sessions · DC routing</text>

    <rect x="760" y="110" width="120" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="820" y="140" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">Transport</text>
    <text x="820" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">MTProto 2.0</text>

    <line x1="220" y1="145" x2="286" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="470" y1="145" x2="536" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="720" y1="145" x2="756" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="290" y="240" width="180" height="62" rx="12" fill="#0f2e2a" stroke="#14b8a6"/>
    <text x="380" y="266" fill="#ccfbf1" font-size="14" font-weight="600" text-anchor="middle">TL codec</text>
    <text x="380" y="285" fill="#5eead4" font-size="11" text-anchor="middle">writer · reader · IDs</text>

    <rect x="540" y="240" width="180" height="62" rx="12" fill="#0f2e2a" stroke="#14b8a6"/>
    <text x="630" y="266" fill="#ccfbf1" font-size="14" font-weight="600" text-anchor="middle">Crypto</text>
    <text x="630" y="285" fill="#5eead4" font-size="11" text-anchor="middle">AES-IGE · RSA · DH</text>

    <rect x="760" y="240" width="120" height="62" rx="12" fill="#1e293b" stroke="#a855f7"/>
    <text x="820" y="266" fill="#f3e8ff" font-size="14" font-weight="600" text-anchor="middle">WASM</text>
    <text x="820" y="285" fill="#d8b4fe" font-size="11" text-anchor="middle">embedded engine</text>

    <line x1="380" y1="180" x2="380" y2="236" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="630" y1="180" x2="630" y2="236" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="720" y1="271" x2="756" y2="271" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="350" width="250" height="78" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="165" y="378" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">HTTP 206 streaming</text>
    <text x="165" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">Range · ETag · 304 · HEAD · 416</text>
    <text x="165" y="416" fill="#94a3b8" font-size="11" text-anchor="middle">batches of 1–8 MB</text>

    <rect x="335" y="350" width="250" height="78" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="460" y="378" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">WebSocket streaming</text>
    <text x="460" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">pooled bot sessions</text>
    <text x="460" y="416" fill="#94a3b8" font-size="11" text-anchor="middle">HMAC stream tokens</text>

    <rect x="630" y="350" width="250" height="78" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="755" y="378" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Telegram DCs</text>
    <text x="755" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">FILE_MIGRATE_X routing</text>
    <text x="755" y="416" fill="#94a3b8" font-size="11" text-anchor="middle">upload.getFile 1 MB cap</text>

    <line x1="380" y1="302" x2="165" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="380" y1="302" x2="460" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="880" y1="145" x2="755" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <text x="40" y="478" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">Mellouki Jamal · Asynctric · ASYNCTRIC-3.0</text>
</svg>
