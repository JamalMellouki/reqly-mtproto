<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="reqly 2.1.0 — MTProto 2.0 for the edge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090f"/>
      <stop offset="0.55" stop-color="#081423"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1b3556" stroke-opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- identity -->
  <rect x="76" y="66" width="94" height="94" rx="26" fill="url(#accent)"/>
  <rect x="84" y="74" width="78" height="78" rx="20" fill="#07111f" opacity="0.87"/>
  <path d="M130 82 108 124h16l-7 26 25-43h-15l4-25Z" fill="url(#accent)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="196" y="118" fill="#9fe7ff" font-size="24" font-weight="700" letter-spacing="4">V2.1.0 · RELEASE CARD</text>
    <text x="74" y="278" fill="url(#word)" font-size="132" font-weight="800" letter-spacing="-6">reqly</text>
    <text x="80" y="348" fill="#e7f3ff" font-size="38" font-weight="650" letter-spacing="-0.8">MTProto 2.0 for the edge.</text>
    <text x="80" y="396" fill="#8fa7c6" font-size="25">Stream files. Respect ranges. Cache the rest.</text>
  </g>

  <!-- feature chips -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">
    <g fill="#c9e8ff">
      <rect x="80" y="442" width="150" height="44" rx="22" fill="#0c1d31" stroke="#24405f"/>
      <text x="104" y="470">Streaming</text>
      <rect x="242" y="442" width="132" height="44" rx="22" fill="#0c1d31" stroke="#24405f"/>
      <text x="266" y="470">HTTP 206</text>
      <rect x="386" y="442" width="112" height="44" rx="22" fill="#0c1d31" stroke="#24405f"/>
      <text x="410" y="470">Cache</text>
      <rect x="510" y="442" width="112" height="44" rx="22" fill="#0c1d31" stroke="#24405f"/>
      <text x="534" y="470">Retry</text>
    </g>
    <g fill="#9fd8f7">
      <rect x="80" y="498" width="150" height="44" rx="22" fill="#0a1a2b" stroke="#1f3a56"/>
      <text x="104" y="526">Cross-DC</text>
      <rect x="242" y="498" width="190" height="44" rx="22" fill="#0a1a2b" stroke="#1f3a56"/>
      <text x="266" y="526">Zero runtime deps</text>
    </g>
  </g>

  <!-- terminal / result card -->
  <g filter="url(#shadow)">
    <rect x="760" y="104" width="452" height="432" rx="26" fill="#070f1c" stroke="#1e3550"/>
    <rect x="760" y="104" width="452" height="52" rx="26" fill="#0b1728"/>
    <rect x="760" y="130" width="452" height="26" fill="#0b1728"/>
    <circle cx="790" cy="130" r="6" fill="#334e6d"/>
    <circle cx="812" cy="130" r="6" fill="#334e6d"/>
    <circle cx="834" cy="130" r="6" fill="#334e6d"/>
    <text x="864" y="136" fill="#7089a8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">GET /file · Range: bytes=0-8388607</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
    <text x="792" y="196" fill="#5f7897">// npm install reqlyproto</text>
    <text x="792" y="232" fill="#c792ea">import <tspan fill="#d7e6f7">{ createReqlySdk }</tspan> <tspan fill="#c792ea">from</tspan> <tspan fill="#86efac">"reqlyproto"</tspan></text>
    <text x="792" y="268" fill="#d7e6f7"> </text>
    <text x="792" y="304" fill="#c792ea">const <tspan fill="#d7e6f7">sdk = </tspan><tspan fill="#82aaff">await</tspan> <tspan fill="#d7e6f7">createReqlySdk({</tspan></text>
    <text x="816" y="340" fill="#d7e6f7">session: <tspan fill="#86efac">MT_SESSION</tspan>,</text>
    <text x="816" y="376" fill="#d7e6f7">cache: <tspan fill="#82aaff">new</tspan> <tspan fill="#ffcb6b">MemoryCache</tspan>(),</text>
    <text x="792" y="412" fill="#d7e6f7">})</text>
    <text x="792" y="448" fill="#c792ea">const <tspan fill="#d7e6f7">bytes = </tspan><tspan fill="#82aaff">await</tspan> <tspan fill="#d7e6f7">sdk.download(doc)</tspan></text>
    <text x="792" y="490" fill="#5f7897">// 206 · Content-Range · ETag · cache hit</text>
  </g>

  <rect x="792" y="510" width="388" height="1" fill="#1c334d"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#8fa7c6">
    <text x="792" y="540">1 MB blocks · 2→4 workers · HMAC tokens</text>
    <text x="792" y="566" fill="#6d8aab">Mellouki Jamal · Asynctric · ASYNCTRIC-3.0</text>
  </g>
</svg>
